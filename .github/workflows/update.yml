name: Update data

on:
  schedule:
    - cron: "0 3 * * *"   # every day 07:00 UAE time
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news and threat intel
        run: python scripts/collect.py
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "cyber-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)
